name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Pruebas en servidor
        run: ./gradlew runGameTestServer --no-daemon 2>&1 | tee gametest.log; grep -q "required tests passed" gametest.log

      - name: Subir .jar
        uses: actions/upload-artifact@v4
        with:
          name: sugar-jar
          path: build/libs/*.jar
