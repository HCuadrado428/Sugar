name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Descargar recursos de Minecraft (con reintentos)
        run: |
          for i in 1 2 3 4; do ./gradlew downloadAssets --no-daemon && break; sleep 10; done

      - name: Pruebas en servidor
        run: ./gradlew runGameTestServer --no-daemon 2>&1 | tee gametest.log; grep -q "required tests passed" gametest.log

      - name: Subir .jar
        uses: actions/upload-artifact@v4
        with:
          name: sugar-jar
          path: build/libs/*.jar

      - name: Publicar el .jar en la rama builds y en la versión "ultima"
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)
          mkdir -p /tmp/builds && cp "$JAR" /tmp/builds/sugar.jar
          cd /tmp/builds
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Compilado de ${GITHUB_SHA}" > LEEME.txt
          git add -A && git commit -qm "sugar.jar de ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds
          cd "$GITHUB_WORKSPACE"
          gh release delete ultima -y --cleanup-tag || true
          gh release create ultima "$JAR" --title "Sugar (última versión)" --notes "Compilado automáticamente de ${GITHUB_SHA::7}. Necesita GeckoLib 4 para Forge 1.20.1." --prerelease
